<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Goose</title>
  <meta name="description" content="A goose web client">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0e1014">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Goose">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="btn-sessions" class="icon-btn" aria-label="Sessions" title="Sessions">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div id="title-wrap">
        <span id="session-title">Goose</span>
        <button id="mode-pill" class="pill" title="Session mode">…</button>
      </div>
      <div id="conn-dot" class="dot dot-down" title="Connection status"></div>
      <button id="btn-new" class="icon-btn" aria-label="New chat" title="New chat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </header>

    <main id="chat" aria-live="polite">
      <div id="welcome" class="welcome">
        <img src="/icons/icon-192.png" alt="" width="72" height="72">
        <h1>Goose</h1>
        <p id="welcome-hint">Connecting…</p>
        <form id="auth-form" hidden>
          <input type="password" id="auth-input" placeholder="goose secret key"
                 autocomplete="off" autocapitalize="off" spellcheck="false">
          <button type="submit" id="auth-submit">Connect</button>
        </form>
      </div>
    </main>

    <div id="permission-slot"></div>

    <footer id="composer">
      <div id="slash-menu" hidden></div>
      <div id="composer-row">
        <textarea id="input" rows="1" placeholder="Message goose…" enterkeyhint="send"
                  autocapitalize="sentences" autocomplete="off" spellcheck="true"></textarea>
        <button id="btn-stop" class="send-btn" hidden aria-label="Stop" title="Stop">
          <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
        </button>
        <button id="btn-send" class="send-btn" aria-label="Send" title="Send">
          <svg viewBox="0 0 24 24"><path d="M12 19V5m0 0l-6 6m6-6l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
    </footer>

    <div id="drawer-backdrop" hidden></div>
    <aside id="drawer" aria-label="Sessions">
      <div class="drawer-head">
        <h2>Sessions</h2>
        <button id="btn-close-drawer" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="session-list" class="session-list"></div>
    </aside>

    <div id="sheet-backdrop" hidden></div>
    <div id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <h2 id="sheet-title">Mode</h2>
      <div id="sheet-options"></div>
    </div>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
